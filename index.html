<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warmindo Tycoon</title>
    <style>
        /* CSS UNTUK MENGATUR TAMPILAN VISUAL GAME (DESAIN MODERN) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background-color: #262626;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0,5);
        }

        /* HEADER: SKOR UANG */
        .header {
            background-color: #d32f2f;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid #fbc02d;
        }

        .header h1 {
            font-size: 1.2rem;
            color: #fbc02d;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .money-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffffff;
            margin: 5px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }

        .ips-display {
            font-size: 1rem;
            color: #ffe082;
        }

        /* AREA TENGAH: TOMBOL TAP UTAMA */
        .tap-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #333333 0%, #1a1a1a 100%);
            position: relative;
        }

        .tap-button {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background-color: #d32f2f;
            border: 8px solid #fbc02d;
            color: white;
            font-size: 4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            transition: transform 0.05s ease;
        }

        .tap-button:active {
            transform: scale(0.92);
        }

        .tap-instruction {
            margin-top: 15px;
            color: #aaaaaa;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* TOMBOL BOOSTER IKLAN SIMULASI */
        .ad-booster {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #388e3c;
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        
        .ad-booster:disabled {
            background-color: #555555;
            cursor: not-allowed;
        }

        /* BAGIAN BAWAH: DAFTAR UPGRADE (MENU TOKO) */
        .upgrade-section {
            height: 40%;
            background-color: #212121;
            border-top: 2px solid #333333;
            overflow-y: auto;
            padding: 15px;
        }

        .section-title {
            font-size: 1.1rem;
            color: #fbc02d;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #333333;
        }

        .upgrade-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2d2d2d;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 5px solid #d32f2f;
        }

        .upgrade-info h3 {
            font-size: 1rem;
            color: #ffffff;
        }

        .upgrade-info p {
            font-size: 0.8rem;
            color: #aaaaaa;
        }

        .upgrade-btn {
            background-color: #fbc02d;
            color: #1a1a1a;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .upgrade-btn:disabled {
            background-color: #424242;
            color: #757575;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- HEADER -->
        <div class="header">
            <h1>Warmindo Tycoon</h1>
            <div class="money-display" id="money-text">Rp 0</div>
            <div class="ips-display" id="ips-text">Pendapatan Pasif: Rp 0/detik</div>
        </div>

        <!-- AREA KLIK -->
        <div class="tap-area">
            <div class="tap-button" id="main-tap">🍜</div>
            <div class="tap-instruction">TAP MANGKOK UNTUK JUALAN</div>
            <button class="ad-booster" id="ad-btn">🎬 Tonton Iklan (Booster 2x Speed)</button>
        </div>

        <!-- AREA UPGRADE -->
        <div class="upgrade-section">
            <div class="section-title">Daftar Menu & Perlengkapan</div>
            
            <!-- UPGRADE 1 -->
            <div class="upgrade-card">
                <div class="upgrade-info">
                    <h3>Panci Indomie Plus</h3>
                    <p id="up1-desc">Pemasukan otomatis (+1 Rp/detik)<br>Miliki: 0</p>
                </div>
                <button class="upgrade-btn" id="up1-btn">Beli [Rp 50]</button>
            </div>

            <!-- UPGRADE 2 -->
            <div class="upgrade-card">
                <div class="upgrade-info">
                    <h3>Kompor High-Pressure</h3>
                    <p id="up2-desc">Meningkatkan kekuatan Klik (+5 Rp/Klik)<br>Miliki: 0</p>
                </div>
                <button class="upgrade-btn" id="up2-btn">Beli [Rp 200]</button>
            </div>
        </div>
    </div>

    <script>
        /* JAVASCRIPT: LOGIKA GAMEPLAY, MATEMATIKA, DAN AUTO-SAVE */
        let gameData = {
            money: 0,
            clickPower: 1,
            idleIncome: 0,
            boosterActive: false,
            up1Count: 0,
            up1Cost: 50,
            up2Count: 0,
            up2Cost: 200
        };

        let boosterMultiplier = 1;

        // KONEKSIKAN KE UI HTML
        const moneyText = document.getElementById('money-text');
        const ipsText = document.getElementById('ips-text');
        const mainTap = document.getElementById('main-tap');
        const adBtn = document.getElementById('ad-btn');
        const up1Btn = document.getElementById('up1-btn');
        const up1Desc = document.getElementById('up1-desc');
        const up2Btn = document.getElementById('up2-btn');
        const up2Desc = document.getElementById('up2-desc');

        // FORMAT RUPIAH
        function formatRupiah(num) {
            return "Rp " + Math.floor(num).toLocaleString('id-ID');
        }

        // UPDATE TAMPILAN LAYAR
        function updateUI() {
            let currentIps = gameData.idleIncome * boosterMultiplier;
            moneyText.innerText = formatRupiah(gameData.money);
            ipsText.innerText = `Pendapatan Pasif: ${formatRupiah(currentIps)}/detik`;
            
            up1Desc.innerHTML = `Pemasukan otomatis (+1 Rp/detik)<br>Miliki: ${gameData.up1Count}`;
            up1Btn.innerText = `Beli [${formatRupiah(gameData.up1Cost)}]`;
            up1Btn.disabled = gameData.money < gameData.up1Cost;

            up2Desc.innerHTML = `Meningkatkan kekuatan Klik (+5 Rp/Klik)<br>Miliki: ${gameData.up2Count}`;
            up2Btn.innerText = `Beli [${formatRupiah(gameData.up2Cost)}]`;
            up2Btn.disabled = gameData.money < gameData.up2Cost;
        }

        // FUNGSI TOMBOL TAP UTAMA
        mainTap.addEventListener('click', () => {
            let actualClick = gameData.clickPower * boosterMultiplier;
            gameData.money += actualClick;
            updateUI();
            saveGame();
        });

        // FUNGSI BELI UPGRADE 1 (PANCI)
        up1Btn.addEventListener('click', () => {
            if (gameData.money >= gameData.up1Cost) {
                gameData.money -= gameData.up1Cost;
                gameData.up1Count++;
                gameData.idleIncome += 1;
                gameData.up1Cost = Math.floor(gameData.up1Cost * 1.15); // Naik harga 15%
                updateUI();
                saveGame();
            }
        });

        // FUNGSI BELI UPGRADE 2 (KOMPOR)
        up2Btn.addEventListener('click', () => {
            if (gameData.money >= gameData.up2Cost) {
                gameData.money -= gameData.up2Cost;
                gameData.up2Count++;
                gameData.clickPower += 5;
                gameData.up2Cost = Math.floor(gameData.up2Cost * 1.15); // Naik harga 15%
                updateUI();
                saveGame();
            }
        });

        // SIMULASI IKLAN BERHADIAH (REWARDED ADS BOOSTER)
        adBtn.addEventListener('click', () => {
            adBtn.disabled = true;
            adBtn.innerText = "🎬 Memutar Iklan (5s)...";
            
            // Simulasi loading nonton iklan 5 detik
            setTimeout(() => {
                boosterMultiplier = 2; // Pendapatan dikali 2
                adBtn.innerText = "🚀 BOOSTER AKTIF (2x SPEED) - 30s";
                updateUI();

                // Efek booster hilang setelah 30 detik
                setTimeout(() => {
                    boosterMultiplier = 1;
                    adBtn.disabled = false;
                    adBtn.innerText = "🎬 Tonton Iklan (Booster 2x Speed)";
                    updateUI();
                }, 30000);

            }, 5000);
        });

        // LOOP PENDAPATAN OTOMATIS (Berjalan tiap 1 detik)
        setInterval(() => {
            gameData.money += (gameData.idleIncome * boosterMultiplier);
            updateUI();
            if(Math.random() < 0.2) saveGame(); // Auto save berkala ke browser
        }, 1000);

        // FITUR SAVE & LOAD GAME (localStorage)
        function saveGame() {
            localStorage.setItem('warmindoTycoonSave', JSON.stringify(gameData));
        }

        function loadGame() {
            const savedData = localStorage.getItem('warmindoTycoonSave');
            if (savedData) {
                gameData = JSON.parse(savedData);
                updateUI();
            }
        }

        // Jalankan load data saat game pertama dibuka
        loadGame();
        updateUI();
    </script>
</body>
</html>
